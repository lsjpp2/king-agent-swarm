  <text x="60" y="200" font-size="11" fill="#f5f3ff" opacity="0.95">7 级梯 need?→exists?→stdlib?→native?→dep?→oneliner?→minimal · 思考型模型自动 bypass</text>
  <rect x="556" y="164" width="66" height="20" rx="10" fill="#ffffff" opacity="0.25"/>
  <text x="589" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">v5.5</text>

  <!-- Layer 3 : v5.4 -->
  <g filter="url(#sh)">
    <rect x="40" y="224" width="600" height="62" rx="10" fill="url(#g4)"/>
  </g>

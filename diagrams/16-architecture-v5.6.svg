  <text x="60" y="270" font-size="11" fill="#ecfdf5" opacity="0.95">反模式库 · 检索注入 · 经验蒸馏 · 决策校准 · deliberate 门控 · Loop Driver 闭环自修</text>
  <rect x="574" y="234" width="48" height="20" rx="10" fill="#ffffff" opacity="0.22"/>
  <text x="598" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">v5.4</text>

  <!-- Layer 4 : v5.3 -->
  <g filter="url(#sh)">
    <rect x="40" y="294" width="600" height="62" rx="10" fill="url(#g3)"/>
  </g>
  <text x="60" y="320" font-size="14" font-weight="700" fill="#ffffff">④ 治理层 Governance Layer</text>
  <text x="60" y="340" font-size="11" fill="#eff6ff" opacity="0.95">策略即代码 policy.json · 急停 kill-switch · 防篡改审计链 · HMAC 身份归因</text>
  <rect x="574" y="304" width="48" height="20" rx="10" fill="#ffffff" opacity="0.22"/>
  <text x="598" y="318" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">v5.3</text>


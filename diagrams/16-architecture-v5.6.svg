  <text x="60" y="410" font-size="11" fill="#f1f5f9" opacity="0.95">5 行代码接入任意平台 · Claude / Cursor / OpenCode / Codex / WorkBuddy …</text>

  <!-- Layer 6 -->
  <g filter="url(#sh)">
    <rect x="40" y="434" width="600" height="62" rx="10" fill="url(#c6)"/>
  </g>

  <text x="340" y="62" text-anchor="middle" font-size="12" fill="#64748b">九层治理栈 · 平台无关 · 部署者即国王（Deployer = King）</text>

  <!-- Layer 1 : v5.6 -->
  <g filter="url(#sh)">
    <rect x="40" y="84" width="600" height="62" rx="10" fill="url(#g6)"/>
  </g>
  <text x="60" y="110" font-size="14" font-weight="700" fill="#ffffff">① 预执行经济学 Pre-Execution Economics</text>
  <text x="60" y="130" font-size="11" fill="#fffbeb" opacity="0.95">T2 复杂度分级路由 80/15/5 · T1 四层 token 治理（诚实边界：只吃到 code_gen −40%）</text>
  <rect x="556" y="94" width="66" height="20" rx="10" fill="#ffffff" opacity="0.25"/>
  <text x="589" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">v5.6 NEW</text>

  <!-- Layer 2 : v5.5 -->
  <g filter="url(#sh)">
    <rect x="40" y="154" width="600" height="62" rx="10" fill="url(#g5)"/>
  </g>

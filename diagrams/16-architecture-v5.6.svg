  <g filter="url(#sh)">
    <rect x="40" y="504" width="600" height="62" rx="10" fill="url(#c7)"/>
  </g>
  <text x="60" y="530" font-size="14" font-weight="700" fill="#ffffff">⑦ 520 运行时护栏 Runtime Guard</text>
  <text x="60" y="550" font-size="11" fill="#f1f5f9" opacity="0.95">可追溯 · 可恢复 · 可修复 · 可进化（铁律 8/9/10/12：脚本 + 核验 + 清单 + 强制门禁）</text>

  <!-- Layer 8 -->
  <g filter="url(#sh)">
    <rect x="40" y="574" width="600" height="62" rx="10" fill="url(#c8)"/>
  </g>
  <text x="60" y="600" font-size="14" font-weight="700" fill="#ffffff">⑧ 声明式宪法 Constitution-as-Code</text>
  <text x="60" y="620" font-size="11" fill="#f1f5f9" opacity="0.95">constitution.json 可机器解析 · 规则可验证 · 国王动态解析，绝不硬编码名字</text>

  <!-- Layer 9 -->
  <g filter="url(#sh)">
    <rect x="40" y="644" width="600" height="62" rx="10" fill="url(#c9)"/>
  </g>
  <text x="60" y="670" font-size="14" font-weight="700" fill="#ffffff">⑨ 记忆完整性 Memory Integrity</text>
  <text x="60" y="690" font-size="11" fill="#f1f5f9" opacity="0.95">SHA-256 指纹 + drift 检测 · 写入前阻止覆盖（不是丢失后恢复）· 记忆隔离墙 strict</text>

  <!-- Footer -->
  <text x="340" y="732" text-anchor="middle" font-size="11" fill="#94a3b8">执行管线 L0 意图 → L1 分流 → L2 预执行决策(v5.5/5.6) → L3 执行 → L4 kaf_gate 门禁 → L5 多视角审查 → L6 520 自检</text>
  <text x="340" y="752" text-anchor="middle" font-size="11" fill="#94a3b8">KAF 管「怎么治理 Agent」，CrewAI / LangGraph 管「怎么执行任务」——互补，不替代</text>
</svg>

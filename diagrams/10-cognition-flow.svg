<svg viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>进智脊柱五零件数据流</title>
  <desc>任务开始→检索注入(读反模式库+经验库)→决策(校准引擎比对)→deliberate()门控→执行→经验蒸馏(写经验库)→回环</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .th{font-family:var(--font-sans,sans-serif);font-size:16px;font-weight:600;fill:#2C2C2A}
      .ts{font-family:var(--font-sans,sans-serif);font-size:12px;font-weight:400;fill:#5F5E5A}
      .cap{font-family:var(--font-sans,sans-serif);font-size:12.5px;font-weight:500;fill:#2C2C2A}
      .lbl{font-family:var(--font-sans,sans-serif);font-size:11px;font-weight:600}
    </style>
  </defs>

  <text class="th" x="40" y="34">进智脊柱 · 五零件数据流</text>
  <text class="ts" x="40" y="56">检索注入把历史经验拉进上下文；蒸馏把新经验写回；deliberate() 在高利害动作前刹车</text>

  <!-- 侧存：反模式库 -->
  <rect x="30" y="120" width="175" height="64" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.6"/>
  <text class="cap" x="117" y="146" text-anchor="middle" fill="#7A2222">① 反模式库</text>
  <text class="ts" x="117" y="166" text-anchor="middle">共享层 · 只读</text>

  <!-- 侧存：经验库 -->
  <rect x="475" y="300" width="175" height="64" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.6"/>
  <text class="cap" x="562" y="326" text-anchor="middle" fill="#2E5A0D">经验库</text>
  <text class="ts" x="562" y="346" text-anchor="middle">蒸馏产物 · 带置信度</text>

  <!-- 侧：决策校准引擎 -->
  <rect x="475" y="150" width="175" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
  <text class="cap" x="562" y="176" text-anchor="middle" fill="#854F0B">④ 决策校准引擎</text>
  <text class="ts" x="562" y="196" text-anchor="middle">比对历史经验</text>

  <!-- 主管道 x=240 w=170 h=46 -->
  <g>
    <rect x="240" y="24" width="170" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text class="cap" x="325" y="52" text-anchor="middle">任务开始</text>
  </g>
  <g>
    <rect x="240" y="96" width="170" height="46" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
    <text class="cap" x="325" y="124" text-anchor="middle">② 检索注入</text>
  </g>
  <g>
    <rect x="240" y="168" width="170" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text class="cap" x="325" y="196" text-anchor="middle">决策</text>
  </g>
  <g>
    <rect x="240" y="240" width="170" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
    <text class="cap" x="325" y="268" text-anchor="middle">⑤ deliberate() 门控</text>
  </g>
  <g>
    <rect x="240" y="312" width="170" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text class="cap" x="325" y="340" text-anchor="middle">执行</text>
  </g>
  <g>
    <rect x="240" y="384" width="170" height="46" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
    <text class="cap" x="325" y="412" text-anchor="middle">③ 经验蒸馏（置信度）</text>
  </g>
  <g>
    <rect x="240" y="448" width="170" height="38" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.6"/>
    <text class="cap" x="325" y="471" text-anchor="middle">回写经验库</text>
  </g>

  <!-- 竖向管道箭头 -->
  <line x1="325" y1="70" x2="325" y2="94" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="325" y1="142" x2="325" y2="166" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="325" y1="214" x2="325" y2="238" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="325" y1="286" x2="325" y2="310" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="325" y1="358" x2="325" y2="382" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="325" y1="430" x2="325" y2="446" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ① -> ② 读 -->
  <line x1="205" y1="152" x2="238" y2="119" stroke="#A32D2D" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text class="lbl" x="205" y="138" fill="#A32D2D">读</text>

  <!-- 决策 -> ④ 比对 -->
  <line x1="410" y1="191" x2="473" y2="182" stroke="#854F0B" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text class="lbl" x="412" y="178" fill="#854F0B">比对</text>
  <line x1="473" y1="200" x2="410" y2="206" stroke="#854F0B" stroke-width="0.8" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- ③ -> 经验库 写 -->
  <line x1="410" y1="407" x2="473" y2="332" stroke="#3B6D11" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text class="lbl" x="430" y="384" fill="#3B6D11">写</text>

  <text class="ts" x="340" y="492" text-anchor="middle">回环：经验库 → 下次检索注入，误差逐轮收敛</text>
</svg>

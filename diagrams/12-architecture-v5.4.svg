<svg viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, sans-serif;">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="116%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.18"/></filter>
    <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#2d6cdf"/></linearGradient>
    <linearGradient id="gC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7be0a0"/><stop offset="1" stop-color="#4dc970"/></linearGradient>
    <linearGradient id="gT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="gG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="gR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f78166"/><stop offset="1" stop-color="#d45a3e"/></linearGradient>
    <linearGradient id="gK" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0c040"/><stop offset="1" stop-color="#d4a030"/></linearGradient>
    <linearGradient id="gM" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#79c0ff"/><stop offset="1" stop-color="#388bfd"/></linearGradient>
  </defs>

  <rect width="680" height="620" rx="14" fill="#0d1117"/>

  <text x="340" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#f0f0f0">🧠  KAF v5.4 · Layered Architecture</text>
  <text x="340" y="58" text-anchor="middle" font-size="11" fill="#8b949e" font-style="italic">Cognition Spine (NEW, teal) joins v5.3 governance · King identity dynamic (resolve_king)</text>

  <!-- L1 Platform Adapters -->
  <rect x="40" y="74" width="600" height="54" rx="10" fill="url(#gA)" filter="url(#sh)"/>
  <text x="60" y="98" font-size="13" font-weight="800" fill="white">🧩  Platform Adapters</text>
  <text x="60" y="118" font-size="10" fill="rgba(255,255,255,0.85)">WorkBuddy / Claude / OpenCode / Cursor / Kimi — 5 行代码接入任意平台；dispatch 派发到共享队列</text>

  <!-- L2 Coordinator Protocol -->
  <rect x="40" y="136" width="600" height="54" rx="10" fill="url(#gC)" filter="url(#sh)"/>
  <text x="60" y="160" font-size="13" font-weight="800" fill="#1a1a2e">🔄  Coordinator Protocol</text>
  <text x="60" y="180" font-size="10" fill="rgba(26,26,46,0.85)">宰相轮值 · 3票 vs 1票 · 国王一票否决 · handover_state 交接</text>

  <!-- L3 Cognition Spine (NEW) -->
  <rect x="40" y="198" width="600" height="54" rx="10" fill="url(#gT)" filter="url(#sh)" stroke="#5eead4" stroke-width="1.5"/>
  <text x="60" y="222" font-size="13" font-weight="800" fill="#042f2e">🧠  Cognition Spine  ★ v5.4 NEW</text>
  <text x="60" y="242" font-size="10" fill="rgba(4,47,46,0.9)">反模式库 · 检索注入 · 经验蒸馏(置信度) · 决策校准 · deliberate() 门控 · 闭环自修(Loop Driver)</text>
  <text x="560" y="220" font-size="9" fill="#042f2e" font-weight="700">与治理层正交</text>
  <text x="560" y="236" font-size="9" fill="#042f2e" font-weight="700">受 520/kill-switch 约束</text>

  <!-- L4 Governance -->
  <rect x="40" y="260" width="600" height="54" rx="10" fill="url(#gG)" filter="url(#sh)" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="60" y="284" font-size="13" font-weight="800" fill="white">🛡️  Governance Layer  ★ v5.3</text>
  <text x="60" y="304" font-size="10" fill="rgba(255,255,255,0.9)">策略即代码(policy.json) · 急停(kill-switch) · 防篡改审计链 · Agent 身份归因(HMAC)</text>
  <text x="560" y="282" font-size="9" fill="#ede9fe" font-weight="700">evaluate(): kill→attest→guard520→policy</text>
  <text x="560" y="298" font-size="9" fill="#ede9fe" font-weight="700">全程写审计链</text>

  <!-- L5 520 Runtime Guard -->
  <rect x="40" y="322" width="600" height="54" rx="10" fill="url(#gR)" filter="url(#sh)"/>
  <text x="60" y="346" font-size="13" font-weight="800" fill="white">⚡  520 Runtime Guard</text>
  <text x="60" y="366" font-size="10" fill="rgba(255,255,255,0.85)">4 检查点 · 铁律8/9/10 · agent侧门禁 kaf_gate.py</text>

  <!-- L6 Constitution-as-Code -->
  <rect x="40" y="384" width="600" height="54" rx="10" fill="url(#gK)" filter="url(#sh)"/>
  <text x="60" y="408" font-size="13" font-weight="800" fill="#1a1a2e">📜  Constitution-as-Code</text>
  <text x="60" y="428" font-size="10" fill="rgba(26,26,46,0.85)">声明式宪法 JSON · economics_routing/dispatch/review_loop/shared_ledger/governance/cognition · sovereign.king_resolver 动态国王</text>

  <!-- L7 Memory Integrity -->
  <rect x="40" y="446" width="600" height="54" rx="10" fill="url(#gM)" filter="url(#sh)"/>
  <text x="60" y="470" font-size="13" font-weight="800" fill="white">🔐  Memory Integrity</text>
  <text x="60" y="490" font-size="10" fill="rgba(255,255,255,0.85)">SHA-256 指纹 + drift 检测 + protect_write · 隔离墙 strict · 共享账本 .memory_ledger.db · cognition/ 共享经验</text>

  <!-- Action flow arrow -->
  <rect x="14" y="74" width="20" height="426" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="24" y="287" text-anchor="middle" font-size="9" fill="#8b949e" transform="rotate(-90 24 287)">AGENT ACTION ↓</text>

  <!-- King resolution callout -->
  <rect x="40" y="514" width="600" height="78" rx="10" fill="#161b22" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="60" y="538" font-size="12" font-weight="800" fill="#c4b5fd">👑  King = resolve_king()  (v5.3 动态 · v5.4 维持)</text>
  <text x="60" y="558" font-size="10" fill="#8b949e">本地作者环境 → 山禾    ｜    远程新手复制 → 当前 OS 用户 / operator</text>
  <text x="60" y="576" font-size="10" fill="#8b949e">显式覆盖：环境变量 KAF_KING 或 kaf_config.json 的 {"king":"你的名字"}</text>
</svg>

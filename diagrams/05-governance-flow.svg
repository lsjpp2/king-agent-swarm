<svg viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, sans-serif;">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="116%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.18"/></filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="4" refY="4.5"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8b949e"/></marker>
    <marker id="arD" markerWidth="9" markerHeight="9" refX="4" refY="4.5"><path d="M0,0 L9,4.5 L0,9 Z" fill="#f78166"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="4" refY="4.5"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7be0a0"/></marker>
  </defs>

  <rect width="680" height="560" rx="14" fill="#0d1117"/>

  <text x="340" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#f0f0f0">🛡️  Governance.evaluate() 评估流程</text>
  <text x="340" y="58" text-anchor="middle" font-size="11" fill="#8b949e" font-style="italic">每一步拒绝都写入防篡改审计链；DENY 优先于 ALLOW</text>

  <!-- Start -->
  <rect x="270" y="74" width="140" height="40" rx="20" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="340" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#58a6ff">Agent 动作 (action)</text>

  <!-- 1 kill-switch -->
  <path d="M340 114 L340 134" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <polygon points="340,138 286,178 394,178" fill="#1c2128" stroke="#f78166" stroke-width="1.5"/>
  <text x="340" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#f78166">kill-switch 激活?</text>
  <path d="M394 158 L470 158 L470 300 L520 300" stroke="#f78166" stroke-width="2" fill="none" marker-end="url(#arD)"/>
  <text x="478" y="230" font-size="10" fill="#f78166" font-weight="600">YES</text>

  <!-- 2 attestation -->
  <path d="M340 178 L340 210" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <polygon points="340,214 284,254 396,254" fill="#1c2128" stroke="#f0c040" stroke-width="1.5"/>
  <text x="340" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="#f0c040">agent 已 attest?</text>
  <path d="M396 234 L470 234 L470 300 L520 300" stroke="#f78166" stroke-width="2" fill="none" marker-end="url(#arD)"/>
  <text x="478" y="214" font-size="10" fill="#f78166" font-weight="600">NO</text>

  <!-- 3 guard520 -->
  <path d="M340 254 L340 286" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <polygon points="340,290 284,330 396,330" fill="#1c2128" stroke="#f78166" stroke-width="1.5"/>
  <text x="340" y="313" text-anchor="middle" font-size="11" font-weight="700" fill="#f78166" >520 护栏拦截?</text>
  <path d="M396 310 L470 310 L470 300 L520 300" stroke="#f78166" stroke-width="2" fill="none" marker-end="url(#arD)"/>
  <text x="478" y="290" font-size="10" fill="#f78166" font-weight="600">YES</text>

  <!-- 4 policy engine -->
  <path d="M340 330 L340 362" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="230" y="366" width="220" height="46" rx="10" fill="#7c3aed" filter="url(#sh)"/>
  <text x="340" y="388" text-anchor="middle" font-size="12" font-weight="800" fill="white">PolicyEngine.evaluate()</text>
  <text x="340" y="404" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.9)">DENY优先 · require 为豁免条件</text>

  <!-- policy -> DENY / ALLOW -->
  <path d="M340 412 L340 444" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <polygon points="340,448 286,488 394,488" fill="#1c2128" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="340" y="471" text-anchor="middle" font-size="11" font-weight="700" fill="#c4b5fd">命中 deny 规则</text>
  <text x="340" y="476" text-anchor="middle" font-size="9" fill="#8b949e">(无豁免)</text>
  <path d="M340 488 L340 510" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- Outcomes -->
  <rect x="500" y="280" width="160" height="40" rx="10" fill="#f78166" filter="url(#sh)"/>
  <text x="580" y="305" text-anchor="middle" font-size="12" font-weight="800" fill="white">⛔ DENY</text>

  <rect x="500" y="498" width="160" height="40" rx="10" fill="#7be0a0" filter="url(#sh)"/>
  <text x="580" y="523" text-anchor="middle" font-size="12" font-weight="800" fill="#1a1a2e">✅ ALLOW</text>

  <!-- DENY edge from policy diamond -->
  <path d="M394 468 L500 468 L500 300 L500 300" stroke="#f78166" stroke-width="2" fill="none" marker-end="url(#arD)"/>
  <path d="M394 468 L500 468" stroke="#f78166" stroke-width="2" fill="none" marker-end="url(#arD)"/>
  <path d="M500 468 L500 320" stroke="#f78166" stroke-width="2" fill="none" marker-end="url(#arD)"/>

  <!-- ALLOW edge from bottom -->
  <path d="M340 510 L340 540 L500 540 L500 538" stroke="#7be0a0" stroke-width="2" fill="none" marker-end="url(#arG)"/>

  <!-- audit note -->
  <text x="60" y="540" font-size="10" fill="#8b949e" font-style="italic">每条结果（含 DENY/ALLOW）均 hash 上链 → audit_chain.log (verify() 可检测篡改)</text>
</svg>

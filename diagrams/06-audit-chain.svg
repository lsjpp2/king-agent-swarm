<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, sans-serif;">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="116%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.18"/></filter>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="4" refY="4.5"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7be0a0"/></marker>
  </defs>

  <rect width="680" height="360" rx="14" fill="#0d1117"/>

  <text x="340" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#f0f0f0">🔗  Tamper-evident Audit Chain</text>
  <text x="340" y="58" text-anchor="middle" font-size="11" fill="#8b949e" font-style="italic">每条记录 hash(prev_hash + payload) ；改任意一行 → verify() 判定断裂</text>

  <!-- GENESIS -->
  <rect x="30" y="90" width="150" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#sh)"/>
  <text x="105" y="116" text-anchor="middle" font-size="11" font-weight="800" fill="#8b949e">GENESIS</text>
  <text x="105" y="140" text-anchor="middle" font-size="9" fill="#8b949e">prev =</text>
  <text x="105" y="156" text-anchor="middle" font-size="9" fill="#58a6ff" font-family="monospace">"0"*64</text>
  <text x="105" y="180" text-anchor="middle" font-size="9" fill="#8b949e">entry =</text>
  <text x="105" y="196" text-anchor="middle" font-size="9" fill="#c9d1d9" font-family="monospace">{...}</text>
  <text x="105" y="222" text-anchor="middle" font-size="9" fill="#8b949e">hash =</text>
  <text x="105" y="238" text-anchor="middle" font-size="8" fill="#7be0a0" font-family="monospace">sha256(...)</text>

  <!-- Block i -->
  <rect x="265" y="90" width="150" height="150" rx="10" fill="#161b22" stroke="#7c3aed" stroke-width="1.5" filter="url(#sh)"/>
  <text x="340" y="116" text-anchor="middle" font-size="11" font-weight="800" fill="#c4b5fd">RECORD[i]</text>
  <text x="340" y="140" text-anchor="middle" font-size="9" fill="#8b949e">prev =</text>
  <text x="340" y="156" text-anchor="middle" font-size="8" fill="#58a6ff" font-family="monospace">hash[i-1]</text>
  <text x="340" y="180" text-anchor="middle" font-size="9" fill="#8b949e">entry =</text>
  <text x="340" y="196" text-anchor="middle" font-size="8" fill="#c9d1d9" font-family="monospace">{action,agent}</text>
  <text x="340" y="214" text-anchor="middle" font-size="8" fill="#c9d1d9" font-family="monospace">{resource,...}</text>
  <text x="340" y="238" text-anchor="middle" font-size="9" fill="#8b949e">hash =</text>
  <text x="340" y="254" text-anchor="middle" font-size="8" fill="#7be0a0" font-family="monospace">sha256(prev|entry)</text>

  <!-- Block i+1 -->
  <rect x="500" y="90" width="150" height="150" rx="10" fill="#161b22" stroke="#7c3aed" stroke-width="1.5" filter="url(#sh)"/>
  <text x="575" y="116" text-anchor="middle" font-size="11" font-weight="800" fill="#c4b5fd">RECORD[i+1]</text>
  <text x="575" y="140" text-anchor="middle" font-size="9" fill="#8b949e">prev =</text>
  <text x="575" y="156" text-anchor="middle" font-size="8" fill="#58a6ff" font-family="monospace">hash[i]</text>
  <text x="575" y="180" text-anchor="middle" font-size="9" fill="#8b949e">entry =</text>
  <text x="575" y="196" text-anchor="middle" font-size="8" fill="#c9d1d9" font-family="monospace">{action,agent}</text>
  <text x="575" y="214" text-anchor="middle" font-size="8" fill="#c9d1d9" font-family="monospace">{resource,...}</text>
  <text x="575" y="238" text-anchor="middle" font-size="9" fill="#8b949e">hash =</text>
  <text x="575" y="254" text-anchor="middle" font-size="8" fill="#7be0a0" font-family="monospace">sha256(prev|entry)</text>

  <!-- arrows -->
  <path d="M180 165 L263 165" stroke="#7be0a0" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
  <path d="M415 165 L498 165" stroke="#7be0a0" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>

  <!-- verify box -->
  <rect x="30" y="270" width="620" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="46" y="294" font-size="12" font-weight="700" fill="#7be0a0">🔍  verify()：从 GENESIS 重算每条 hash 并与存储值比对</text>
  <text x="46" y="314" font-size="10" fill="#8b949e">• 全部一致 → (True, None)   ✅ 审计链完整</text>
  <text x="46" y="328" font-size="10" fill="#f78166">• 任一行被篡改 → (False, broken_index)   ⛔ 防篡改生效（自测已证明：篡改中行后 verify=False）</text>
</svg>

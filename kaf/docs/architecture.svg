<svg viewBox="0 0 680 492" xmlns="http://www.w3.org/2000/svg">
  <title>KAF v5.0 五层治理架构与国王模型</title>
  <desc>King 主权人位于顶部，向下对五层架构施加治理约束；五层自顶向下为平台适配器、宰相协议、520运行时护栏、声明式宪法、记忆完整性。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .t{font-family:sans-serif;font-size:14px;fill:#2C2C2A}
    .ts{font-family:sans-serif;font-size:12px;fill:#5F5E5A}
    .th{font-family:sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}
  </style>

  <g>
    <rect x="220" y="40" width="240" height="48" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">King / 山禾 · 唯一主权人</text>
    <text class="ts" x="340" y="80" text-anchor="middle" dominant-baseline="central">一票否决 · 任命与轮值宰相</text>
  </g>

  <line x1="340" y1="88" x2="340" y2="104" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="40" y="104" width="600" height="64" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="60" y="128" dominant-baseline="central">Platform Adapters · 平台适配器</text>
    <text class="ts" x="60" y="148" dominant-baseline="central">WorkBuddy · Claude · OpenCode · Kimi · Cursor — 5 行代码接入任意平台</text>
  </g>
  <line x1="340" y1="168" x2="340" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="40" y="180" width="600" height="64" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="60" y="204" dominant-baseline="central">Coordinator Protocol · 宰相轮值协议</text>
    <text class="ts" x="60" y="224" dominant-baseline="central">宰相 3 票 / Agent 1 票 · handover_state 交接 · king 下令即刻流转</text>
  </g>
  <line x1="340" y1="244" x2="340" y2="256" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="40" y="256" width="600" height="64" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text class="th" x="60" y="280" dominant-baseline="central">520 Runtime Guard · 运行时护栏</text>
    <text class="ts" x="60" y="300" dominant-baseline="central">pre_execute / pre_delete / post_execute / on_failure — 违规操作运行时拦截</text>
  </g>
  <line x1="340" y1="320" x2="340" y2="332" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="40" y="332" width="600" height="64" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text class="th" x="60" y="356" dominant-baseline="central">Constitution-as-Code · 声明式宪法</text>
    <text class="ts" x="60" y="376" dominant-baseline="central">可机器解析 JSON · 铁律 8/9/10 写进规则 · 开机即校验</text>
  </g>
  <line x1="340" y1="396" x2="340" y2="408" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="40" y="408" width="600" height="64" rx="12" fill="#F1EFE8" stroke="#444441" stroke-width="0.5"/>
    <text class="th" x="60" y="432" dominant-baseline="central">Memory Integrity · 记忆完整性</text>
    <text class="ts" x="60" y="452" dominant-baseline="central">SHA-256 指纹 · drift 检测 · 写入前阻止覆盖（非丢失后恢复）</text>
  </g>
</svg>
